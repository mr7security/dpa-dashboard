<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de Bases de Datos</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#0f1c30;
  --text:#e2e8f0; --muted:#94a3b8;
  --ok:#22c55e; --alarm:#ef4444; --warn:#f59e0b; --off:#64748b;
  --accent:#38bdf8;
}
*{box-sizing:border-box}
body{margin:0;padding:18px 22px;background:var(--bg);color:var(--text);
     font-family:'Segoe UI',system-ui,sans-serif}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;
       margin-bottom:14px;flex-wrap:wrap}
/* margin-right:auto ancla la marca a la izquierda pase lo que pase con el
   resto de la cabecera (botones ocultos, reloj de dos lineas...) */
header .brand{display:flex;align-items:center;gap:14px;margin-right:auto}
#logo{height:42px;display:none;background:#fff;border-radius:8px;padding:3px 8px}
h1{margin:0;font-size:1.3rem;font-weight:800;text-transform:uppercase;
   letter-spacing:.03em;color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{background:var(--card);color:var(--text);border:1px solid #2b3d57;
   border-radius:8px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
.btns button.on{background:#1d3a55;border-color:var(--accent);color:#fff}
/* Fecha larga en 24 h y, debajo, la maquina donde corre el dashboard.
   Igual en las tres vistas. */
#clock{text-align:right;line-height:1.25}
#clock .fecha{font-size:.82rem;font-weight:700;letter-spacing:.06em;
   color:var(--text);font-variant-numeric:tabular-nums}
#clock .srv{font-size:.75rem;color:var(--accent);text-transform:uppercase;
   letter-spacing:.08em;font-weight:700}

footer{margin-top:16px;padding:10px 2px 2px;border-top:1px solid #24334a;
   text-align:center;font-size:.7rem;color:var(--muted);letter-spacing:.1em;
   text-transform:uppercase;opacity:.75}

#banner{display:none;background:#3b1f2b;border:1px solid var(--alarm);
   color:#fecaca;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.9rem}

section.site{background:transparent;border:1px solid var(--sc);border-radius:14px;
   padding:12px 14px;margin-bottom:14px;
   background-image:linear-gradient(180deg,color-mix(in srgb,var(--sc) 8%,transparent),transparent 120px)}
.site-h{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.swatch{width:12px;height:12px;border-radius:3px;background:var(--sc)}
.site-name{font-weight:800;color:var(--sc);letter-spacing:.04em;font-size:1rem}
.pill{font-size:.74rem;padding:3px 9px;border-radius:999px;border:1px solid #2b3d57;
   color:var(--muted);background:var(--card)}
.pill.ok{color:var(--ok);border-color:#14532d}
.pill.warn{color:var(--warn);border-color:#78350f}
.pill.alarm{color:var(--alarm);border-color:#7f1d1d}
.upd{margin-left:auto;font-size:.75rem;color:var(--muted)}

/* Vista normal: un servidor por fila, a todo el ancho */
.cards{display:grid;grid-template-columns:1fr;gap:12px}

/* y dentro, tres zonas en horizontal */
.cbody{display:grid;
   grid-template-columns:minmax(250px,.85fr) minmax(280px,1.15fr) minmax(240px,1fr);
   gap:18px;align-items:stretch}
.zona{min-width:0}
/* la columna izquierda se centra en vertical: es la mas corta y asi no deja
   un hueco muerto debajo */
.zona-a{display:flex;flex-direction:column;justify-content:center}
.cbody > .zona + .zona{border-left:1px solid #24334a;padding-left:18px}

@media (max-width:1100px){
  .cbody{grid-template-columns:1fr;gap:10px}
  .cbody > .zona + .zona{border-left:none;padding-left:0;
     border-top:1px solid #24334a;padding-top:10px}
}
@media (max-width:560px){
  .mstrip{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
/* --cc es el color propio de cada servidor, para identificarlo de un vistazo.
   El estado (warn/alarm/offline) lo sobrescribe, asi que el semaforo manda. */
.card{background:var(--card);border-radius:12px;padding:12px 14px;
   border-left:4px solid var(--cc,var(--sc))}
.card-h h2{color:var(--cc,var(--text))}
.card.warn{border-left-color:var(--warn)}
.card.alarm{border-left-color:var(--alarm);animation:blink 1.2s infinite}
.card.offline{opacity:.7;border-left-color:var(--off)}
@keyframes blink{50%{background:#3b1f2b}}

.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:1rem;font-weight:700}
.card-h .tech{font-size:.72rem;color:var(--muted)}
.t-tv{display:none}
.card-h .status{margin-left:auto;font-size:.75rem;font-weight:700}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.status.alarm{color:var(--alarm)} .status.off{color:var(--off)}

/* Tira de metricas grandes: todas del mismo tamano y alineadas entre si */
.mstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;
   text-align:center}
.m{display:flex;flex-direction:column;gap:1px;min-width:0;align-items:center}
.label{font-size:.66rem;color:var(--muted);text-transform:uppercase;
   letter-spacing:.06em;max-width:100%;overflow-wrap:anywhere;line-height:1.2}
.value{font-size:2.4rem;font-weight:800;line-height:1.05;
   font-variant-numeric:tabular-nums}
.value small{font-size:.9rem;color:var(--muted);font-weight:600;margin-left:3px}
.pie{font-size:.66rem;color:var(--muted);white-space:nowrap;overflow:hidden;
   text-overflow:ellipsis;margin-top:1px}
.v-ok{color:var(--ok)} .v-warn{color:var(--warn)} .v-alarm{color:var(--alarm)}
.v-acc{color:var(--accent)} .v-mut{color:var(--muted)}
.v-txt{color:var(--text)}

/* lista de sesiones bloqueadas */
.blk{margin-top:10px;border:1px solid var(--alarm);border-radius:9px;
   padding:8px 10px;background:#2a1520}
.blk h3{margin:0 0 6px;font-size:.68rem;text-transform:uppercase;
   letter-spacing:.07em;color:var(--alarm);font-weight:800}
/* tabla de bloqueos, comun a la tarjeta y al panel de TV */
.btab{width:100%;border-collapse:collapse;font-size:.74rem;table-layout:auto}
.btab th{text-align:left;font-weight:800;font-size:.6rem;text-transform:uppercase;
   letter-spacing:.06em;color:var(--muted);padding:0 10px 4px 0;
   border-bottom:1px solid #5a2b3b;white-space:nowrap}
.btab td{padding:3px 10px 3px 0;border-bottom:1px solid #3f2130;
   vertical-align:baseline}
.btab tr:last-child td{border-bottom:none}
.btab .c-spid{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.btab .c-num{font-variant-numeric:tabular-nums;white-space:nowrap}
.btab .c-esp{color:var(--warn);font-weight:700;white-space:nowrap}
.btab .c-el{max-width:170px;overflow:hidden;text-overflow:ellipsis;
   white-space:nowrap}
/* la columna de programa absorbe el ancho sobrante: si no, el navegador lo
   reparte entre todas y aparecen huecos enormes antes de la ultima */
.btab .c-ancha{width:99%;max-width:none}
.rol{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;
   padding:1px 6px;border-radius:5px;letter-spacing:.05em;white-space:nowrap}
.rol.b{background:#7f1d1d;color:#fecaca}
.rol.w{background:#78350f;color:#fde68a}

/* Panel de bloqueos del Modo TV: va debajo de las tarjetas, en el hueco */
#bloqueos-tv{display:none}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
   gap:4px 26px}
.bcard h4{margin:0 0 2px;color:var(--cc,var(--warn));font-weight:800;
   letter-spacing:.04em}
.bcard .row{display:flex;gap:10px;align-items:baseline;padding:2px 0;
   border-bottom:1px solid #3f2130}
.bcard .row:last-child{border-bottom:none}
.nota{color:var(--muted);font-size:.76rem;padding:3px 0;font-style:italic}

/* tabla de sesiones activas, con scroll propio y cabecera fija */
.act{margin-top:12px;border-top:1px solid #24334a;padding-top:10px}
.act h3{margin:0 0 6px;font-size:.68rem;text-transform:uppercase;
   letter-spacing:.07em;color:var(--muted);font-weight:800}
.act h3 .pista{color:var(--accent);opacity:.9}
.act .scroll{max-height:230px;overflow:auto;overscroll-behavior:contain}
.act .scroll thead th{position:sticky;top:0;background:var(--card);
   border-bottom:1px solid #2b3d57;z-index:1}
.act .btab td{border-bottom:1px solid #24334a}
.act .scroll::-webkit-scrollbar{width:9px;height:9px}
.act .scroll::-webkit-scrollbar-track{background:var(--card2);border-radius:6px}
.act .scroll::-webkit-scrollbar-thumb{background:#33465f;border-radius:6px}
.act .scroll::-webkit-scrollbar-thumb:hover{background:#43597a}

/* indicadores por categoria, siempre visibles */
.ind{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.zona-a .avisos{justify-content:center}
.ichip{display:flex;align-items:center;gap:6px;font-size:.66rem;
   text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   background:var(--card2);border:1px solid #2b3d57;border-radius:7px;
   padding:3px 9px}
.ichip i{width:8px;height:8px;border-radius:50%;background:var(--off);display:block;
   flex:none}
.ichip.ok i{background:var(--ok)}
.ichip.warn i{background:var(--warn)}
.ichip.alarm i{background:var(--alarm)}
.ichip.unk{opacity:.45}

.detalle{margin-top:0}
.detalle .subt{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;
   color:var(--muted);font-weight:800;margin:10px 0 3px;opacity:.75}
.detalle .subt:first-child{margin-top:0}
/* dos bloques de detalle seguidos: separador claro para que no se solapen */
.zona .detalle + .detalle{margin-top:16px;border-top:1px solid #24334a;
   padding-top:12px}
.zona-c .detalle{margin-bottom:12px}
.zona-c .charts + .detalle{margin-top:12px;margin-bottom:0}
.detalle .subt .pista{text-transform:none;letter-spacing:0;font-weight:400;
   opacity:.7}

/* medidores de porcentaje */
.gauges{margin-top:14px}
.gauges .subt{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;
   color:var(--muted);font-weight:800;margin-bottom:5px;opacity:.75}
.g{display:grid;grid-template-columns:minmax(80px,1fr) minmax(60px,1.1fr) 44px;
   align-items:center;gap:10px;font-size:.72rem;padding:3px 0}
.gl{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar{height:7px;border-radius:999px;background:#24334a;overflow:hidden;
   display:block}
.gbar i{display:block;height:100%;border-radius:999px;background:var(--off);
   transition:width .4s ease}
.gbar i.ok{background:var(--ok)}
.gbar i.warn{background:var(--warn)}
.gbar i.alarm{background:var(--alarm)}
.gv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.detalle table{width:100%;border-collapse:collapse;font-size:.76rem}
.detalle td{padding:3px 0;border-bottom:1px solid #24334a}
.detalle td:first-child{color:var(--muted);width:42%}
.alarmas{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;margin-bottom:2px}
.tag{font-size:.66rem;padding:2px 7px;border-radius:6px;border:1px solid #2b3d57;
   color:var(--muted);background:var(--card2)}
.tag.ok{color:var(--ok);border-color:#14532d}
.tag.warn{color:var(--warn);border-color:#78350f}
.tag.alarm{color:var(--alarm);border-color:#7f1d1d}
.tag.unk{opacity:.45}
.avisos{margin-top:10px;font-size:.74rem;display:flex;flex-wrap:wrap;gap:4px 8px}
.avisos span{background:var(--card2);border:1px solid #2b3d57;border-radius:6px;
   padding:2px 8px}
.avisos.warn{color:var(--warn)} .avisos.warn span{border-color:#78350f}
.avisos.alarm{color:var(--alarm)} .avisos.alarm span{border-color:#7f1d1d}
.avisos.ok{color:var(--ok);opacity:.8}

.charts{display:flex;flex-direction:column;gap:8px;margin-top:0}
.chartblock .clab{font-size:.66rem;color:var(--muted);text-transform:uppercase;
   letter-spacing:.06em}
canvas.chart{width:100%;height:64px;display:block}

/* ---------------- Modo TV ---------------- */
body.tv{padding:10px 12px;overflow:hidden}
/* En TV la tarjeta se queda en lo esencial: sesiones, bloqueos e indicadores */
body.tv #banner,body.tv .card-h .tech,body.tv .upd,
body.tv .detalle,body.tv .charts,body.tv .gauges,body.tv .act,
body.tv .topbloq,
body.tv .m-qual{display:none}
body.tv #sites{display:grid;grid-auto-rows:1fr;gap:10px}
/* la seccion y su rejilla de tarjetas rellenan el alto que se les asigne */
body.tv .site{display:flex;flex-direction:column;min-height:0}
body.tv .site .cards{flex:1;min-height:0}
/* Tarjetas homogeneas. Clave: NO centrar el contenido, porque entonces cada
   tarjeta se desplaza segun cuantos avisos tenga. Se alinea todo arriba y los
   avisos se empujan al fondo, asi los numeros grandes quedan a la misma
   altura en las cinco. */
body.tv footer{margin-top:8px;padding:5px 0 0;
   font-size:clamp(.5rem,.65vw,.95rem)}
body.tv .card{overflow:hidden;min-width:0;display:flex;flex-direction:column;
   justify-content:flex-start;gap:clamp(4px,1vh,14px)}
body.tv .cbody{flex:1;min-height:0;justify-content:flex-start}
body.tv .zona-a{display:flex;flex-direction:column;flex:1;min-height:0}
body.tv .avisos{margin-top:auto;justify-content:center}
body.tv .card-h{justify-content:center;margin-bottom:0}
body.tv .card-h h2{text-align:center}
body.tv .mstrip{grid-template-columns:repeat(2,minmax(0,1fr));
   gap:clamp(10px,2vw,40px);justify-items:center;text-align:center}
/* en TV se cae el reparto en tres zonas: solo queda la primera */
body.tv .cbody{display:flex;flex-direction:column;align-items:stretch;
   gap:clamp(4px,1vh,14px)}
body.tv .zona-b,body.tv .zona-c{display:none}
body.tv .cbody > .zona + .zona{border-left:none;padding-left:0}
body.tv .t-full{display:none}
body.tv .t-tv{display:inline}
/* en TV la lista de bloqueos sale del interior de la tarjeta */
body.tv .card .blk{display:none}

body.tv #bloqueos-tv{display:flex;flex-direction:column;margin-top:10px;
   border:1px solid var(--alarm);border-radius:12px;background:#2a1520;
   padding:clamp(6px,1vh,14px) clamp(10px,1vw,20px);overflow:hidden}
body.tv #bloqueos-tv .bgrid{flex:1;min-height:0;overflow:hidden;
   align-content:start}
body.tv #bloqueos-tv h3{margin:0 0 6px;color:var(--alarm);font-weight:800;
   text-transform:uppercase;letter-spacing:.07em;
   font-size:clamp(.8rem,1.15vw,1.7rem)}
body.tv .bcard h4{font-size:clamp(.75rem,1.05vw,1.5rem)}
body.tv .btab{font-size:clamp(.7rem,1vw,1.45rem)}
body.tv .btab th{font-size:clamp(.55rem,.72vw,1.05rem);padding-bottom:5px}
body.tv .btab td{padding:clamp(2px,.4vh,6px) clamp(8px,.9vw,18px) clamp(2px,.4vh,6px) 0}
body.tv .btab .c-el{max-width:clamp(150px,14vw,340px)}
body.tv .btab .c-ancha{max-width:none}
body.tv .rol{font-size:clamp(.55rem,.72vw,1.05rem);padding:1px 8px}
body.tv .nota{font-size:clamp(.7rem,1vw,1.4rem)}
body.tv .site .cards{grid-auto-flow:column;grid-auto-columns:1fr;
   grid-template-columns:none}
body.tv .site-name{font-size:clamp(1.4rem,2.3vw,3.2rem)}
body.tv .card-h h2{font-size:clamp(1.25rem,1.85vw,2.7rem)}
body.tv .status{font-size:clamp(.7rem,.95vw,1.3rem)}
body.tv .label{font-size:clamp(.6rem,.95vw,1.25rem)}
body.tv .value{font-size:clamp(2rem,4.2vw,7rem);line-height:1.02}
body.tv .value small{font-size:.4em}
body.tv .pie{font-size:clamp(.6rem,.85vw,1.1rem)}
body.tv .m{align-items:center;text-align:center}
body.tv .pill{font-size:clamp(.6rem,.85vw,1.1rem)}
/* el reloj tambien crece en la tele y en presentacion */
body.tv #clock .fecha,body.pres #clock .fecha{font-size:clamp(.72rem,1.05vw,1.55rem)}
body.tv #clock .srv,body.pres #clock .srv{font-size:clamp(.68rem,.95vw,1.4rem)}
/* En TV, indicadores y bloqueos van deliberadamente pequenos: lo que tiene
   que leerse desde lejos son las sesiones. Estos son datos de apoyo, y si
   crecen deforman la tarjeta. */
body.tv .ind{gap:clamp(4px,.5vw,9px);justify-content:center;
   margin-top:clamp(6px,1vh,14px)}
body.tv .ichip{font-size:clamp(.5rem,.6vw,.9rem);padding:2px 7px;
   gap:clamp(4px,.35vw,6px)}
body.tv .ichip i{width:clamp(6px,.5vw,10px);height:clamp(6px,.5vw,10px)}
body.tv .blk{padding:clamp(4px,.7vh,9px) clamp(6px,.7vw,11px);
   margin-top:clamp(6px,1vh,14px);max-height:30vh;overflow:hidden}
body.tv .blk h3{font-size:clamp(.5rem,.58vw,.85rem);margin-bottom:3px}

/* ---------------- Modo Presentacion ---------------- */
/* Una instancia cada vez, a pantalla completa y con todo el detalle. */
#pres-nav{display:none}
body.pres{padding:10px 14px;overflow:hidden;height:100vh;
   display:flex;flex-direction:column}
body.pres header{flex:none}
body.pres #banner{display:none}
/* Pantalla limpia: los botones estorban en una tele. Reaparecen al pasar el
   raton por la cabecera; para salir sin raton, Escape. */
body.pres header .btns{display:none}
body.pres header:hover .btns{display:flex}

/* Marca pegada a la izquierda y reloj a la derecha, pase lo que pase.
   El width:100% no es redundante: al saltar a la diapositiva general el
   navegador recalcula la rejilla del mosaico y, durante ese instante, la
   cabecera se encogia al ancho de su contenido y aparecia centrada. */
body.pres header,
body.pres #pres-nav,
body.pres #sites{width:100%;align-self:stretch}
body.pres header,
body.pres #pres-nav{flex:0 0 auto}
body.pres header{justify-content:space-between;flex-wrap:nowrap}
body.pres header .brand{margin-right:auto}

body.pres #clock{margin-left:auto}
/* La clase .g marca la diapositiva "general": en ella se anade tambien la
   clase tv, asi que manda todo el CSS del Modo TV. Por eso lo especifico de
   una sola instancia va con :not(.g). */
body.pres:not(.g) #bloqueos-tv,
body.pres:not(.g) .site-h{display:none}

body.pres #pres-nav{display:flex;align-items:center;gap:14px;flex:none;
   margin-bottom:8px}
#pres-nav .puntos{display:flex;gap:8px;flex-wrap:wrap;flex:1}
#pres-nav .p{display:flex;align-items:center;gap:6px;cursor:pointer;
   font-size:clamp(.6rem,.85vw,1.05rem);text-transform:uppercase;
   letter-spacing:.06em;color:var(--muted);border:1px solid #2b3d57;
   background:var(--card);border-radius:999px;padding:3px 12px;opacity:.55}
#pres-nav .p i{width:8px;height:8px;border-radius:50%;background:var(--cc);
   display:block;flex:none}
#pres-nav .p.on{opacity:1;color:var(--text);border-color:var(--cc)}
#pres-nav .p.mal{border-color:var(--alarm)}
#pres-nav .p.gen{--cc:var(--muted);font-weight:700}
#pres-nav .p.gen.on{--cc:var(--text)}
#pres-nav .cuenta{font-variant-numeric:tabular-nums;color:var(--muted);
   font-size:clamp(.6rem,.85vw,1.05rem);white-space:nowrap}
#pres-nav .barra{width:clamp(60px,10vw,160px);height:5px;border-radius:999px;
   background:#24334a;overflow:hidden;flex:none}
#pres-nav .barra i{display:block;height:100%;background:var(--accent);
   transition:width .95s linear}

body.pres #sites{flex:1;min-height:0}
body.pres:not(.g) section.site{height:100%;display:flex;flex-direction:column;
   padding:10px 14px}
body.pres:not(.g) .cards{display:block;height:100%;gap:0}
body.pres:not(.g) .card{display:none}
body.pres:not(.g) .card.pres-on{display:flex;flex-direction:column;height:100%;
   overflow:hidden}
/* Tres columnas: resumen estrecho, y las dos tablas repartiendose el resto */
body.pres:not(.g) .cbody{flex:1;min-height:0;align-items:stretch;
   grid-template-columns:minmax(240px,.8fr) minmax(0,1.4fr) minmax(0,1.2fr)}
body.pres:not(.g) .zona{overflow:hidden;display:flex;flex-direction:column}

/* Las tres metricas se apilan, con la etiqueta al lado del numero: en una
   columna estrecha, tres numeros grandes en fila no caben y se salen. */
body.pres:not(.g) .zona-a{justify-content:flex-start}
body.pres:not(.g) .mstrip{grid-template-columns:1fr;gap:0;text-align:left}
body.pres:not(.g) .m{flex-direction:row;flex-wrap:wrap;align-items:baseline;
   gap:0 12px}
body.pres:not(.g) .m .label{order:1;flex:0 0 auto;
   font-size:clamp(.6rem,.78vw,1.05rem)}

  <div class="ic">&#9888;</div>
  <div class="t">SIN CONEXION</div>
  <div class="s">No se puede contactar con el servicio del dashboard</div>
  <div class="cron" id="cron">00:00:00</div>
</div>

<script>
"use strict";

const REFRESH_S = 10;
const HIST_REFRESH_S = 60;

const SECCION = {nombre:"SQL SERVER", color:"#38bdf8"};

// Un color por servidor. Deliberadamente sin verdes, ambares ni rojos: esos
// estan reservados al semaforo y mezclarlos confundiria.
const COLORES_SRV = ["#38bdf8", "#818cf8", "#a78bfa", "#e879f9", "#f472b6"];
const COLOR_SRV_FIJO = {
  "AQUILES":                      "#38bdf8",  // cian
  "PROMETEO":                     "#818cf8",  // indigo
  "SRVPBI":                       "#a78bfa",  // violeta
  "SRVPRORPDB01 via ATENEA2":     "#e879f9",  // fucsia
  "SRVPROSCDB1 via SCALEPRODBAO": "#f472b6"   // rosa
};

function colorServidor(nombre){
  const n = String(nombre || "");
  if (COLOR_SRV_FIJO[n]) return COLOR_SRV_FIJO[n];
  // los que no esten en la lista reciben uno estable a partir del nombre
  let h = 0;
  for (let k = 0; k < n.length; k++) h = (h * 31 + n.charCodeAt(k)) >>> 0;
  return COLORES_SRV[h % COLORES_SRV.length];
}

const NIVEL_INFO = {
  ok:      {cls:"ok",    txt:"✔ OK",         card:""},
  aviso:   {cls:"warn",  txt:"⚠ DEGRADADO",  card:"warn"},
  critico: {cls:"alarm", txt:"⚠ CRÍTICO", card:"alarm"},
  caido:   {cls:"off",   txt:"✖ CAÍDO",  card:"offline"}
};

const CAT_ES = {
  "CPU":"CPU", "Memory":"Memoria", "Disk":"Disco", "Sessions":"Sesiones",
  "Waits":"Esperas", "TempDB":"TempDB", "Backups":"Backups",
  "Network":"Red", "License Compliance":"Licencias"
};
// Los 5 que van siempre visibles, tambien en la tele
const CAT_INDICADORES = ["CPU","Memory","Disk","Sessions","Network"];
// El resto, solo en el detalle de la vista normal
const CAT_DETALLE = ["Waits","TempDB","Backups","License Compliance"];

let rangeH = 24;
let alertsOn = false;
try { alertsOn = localStorage.getItem("dpa_alertas") === "1"; } catch(e){}
let prevBad = {};
let histSeries = {};
let disconnectedSince = null;

// ---------------------------------------------------------------- utilidades

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fmt(v, dec){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const d = (dec === undefined) ? (Math.abs(v) >= 100 ? 0 : 1) : dec;
  return Number(v).toLocaleString("es-ES", {minimumFractionDigits:d, maximumFractionDigits:d});
}

function fmtDur(seg){
  if (seg === null || seg === undefined || isNaN(seg)) return "—";
  if (seg < 60) return fmt(seg,1) + " s";
  const m = Math.floor(seg/60), s = Math.round(seg%60);
  return m + " min " + (s ? s + " s" : "");
}

function colorBloqueadas(v){
  // cualquier sesion bloqueada es rojo: es la senal que se vigila aqui
  if (v === null || v === undefined) return "v-mut";
  if (v >= 1) return "v-alarm";
  return "v-ok";
}

const NIVEL_CAT_ES = {CRITICAL:"crítico", WARNING:"aviso", NORMAL:"correcto"};

function colorNivelCat(lvl){
  if (lvl === "CRITICAL") return "alarm";
  if (lvl === "WARNING")  return "warn";
  if (lvl === "NORMAL")   return "ok";
  return "unk";
}

function colorEspera(inst){
  const lvl = (inst.alarmas || {})["Waits"];
  if (lvl === "CRITICAL") return "v-alarm";
  if (lvl === "WARNING")  return "v-warn";
  return "v-acc";
}

function tituloLimpio(nombre){
  return String(nombre || "").replace(/\s+via\s+/i, " · ");
}

// En Modo TV el titulo se acorta: de "SRVPRORPDB01 via ATENEA2" queda
// "ATENEA2". Por defecto se queda con lo que hay detras de "via"; para los
// casos en que ese nombre tampoco convence, se pone aqui la excepcion.
const ALIAS_TV = {
  "SRVPROSCDB1 via SCALEPRODBAO": "SCALEPROD"
};

function tituloTV(nombre){
  const n = String(nombre || "");
  if (ALIAS_TV[n]) return ALIAS_TV[n];
  const m = n.match(/\s+via\s+(.+)$/i);
  return m ? m[1].trim() : n;
}

// ------------------------------------------------------------------ detalle

// Valor con color segun umbrales. `invertido` para las metricas en las que
// "menos es peor" (espacio libre, porcentajes de hueco).
function val(v, unidad, aviso, critico, invertido){
  if (v === null || v === undefined) return null;
  const dec = unidad === "%" ? 0 : undefined;
  const txt = fmt(v, dec) + (unidad ? " " + unidad : "");
  if (aviso === undefined) return txt;
  const malo = invertido ? (v <= critico) : (v >= critico);
  const regular = invertido ? (v <= aviso) : (v >= aviso);
  if (malo)    return '<span class="v-alarm">' + txt + "</span>";
  if (regular) return '<span class="v-warn">' + txt + "</span>";
  return txt;
}

function filas(pares){
  return pares
    .filter(p => p[1] !== null && p[1] !== undefined && p[1] !== "" && p[1] !== "—")
    .map(p => "<tr><td>" + esc(p[0]) + "</td><td>" + p[1] + "</td></tr>")
    .join("");
}

function detalleHTML(i){
  // Los porcentajes viven en los medidores y las latencias en el bloque de
  // disco: aqui solo lo que no esta en ningun otro sitio.
  const rec = filas([
    ["Page life expectancy", val(i.ple, "s", 300, 120, true)],
    ["Batch requests",       val(i.batch_seg, "/s")],
    ["Transacciones",        val(i.trans_seg, "/s")],
    ["Round-trip",           val(i.rtt, "ms", 5, 20)]
  ]);

  const inf = filas([
    ["Motor",            esc(i.tipo)],
    ["Monitor DPA",      esc(i.monitor_estado)],
    ["Sesiones activas (media 1 h)", i.sesiones_activas_media != null ? fmt(i.sesiones_activas_media,1) : null],
    ["Espera media (5 min)", i.wait_medio != null ? fmtDur(i.wait_medio) : null],
    ["Tuning",           i.tabs && i.tabs.tuning ? esc(i.tabs.tuning) : null]
  ]);

  const tempdb = filas([
    ["Espacio libre",       val(i.tempdb_libre_mb, "MB", 2048, 512, true)],
    ["Log libre",           val(i.tempdb_log_libre_mb, "MB", 512, 128, true)],
    ["Log libre (%)",       val(i.tempdb_log_libre_pct, "%", 20, 5, true)]
  ]);

  // El porcentaje global de memoria dice poco: 80 % puede ser sano o ser un
  // desastre. Lo que discrimina es el PLE (cuanto aguanta una pagina en
  // memoria) y las recompilaciones (sintoma de estadisticas que se invalidan
  // sin parar). El tamano de las caches explica en que se va.
  const mem = filas([
    ["Page life expectancy", val(i.ple, "s", 300, 120, true)],
    ["Buffer cache",         i.cache_mb != null ? fmtMB(i.cache_mb) : null],
    ["Caché de planes",      i.plan_cache_mb != null ? fmtMB(i.plan_cache_mb) : null],
    ["Compilaciones",        val(i.compilaciones_seg, "/s")],
    ["Recompilaciones",      val(i.recompilaciones_seg, "/s", 20, 50)],
    ["Acierto de caché",     val(i.cache_hit, "%", 95, 90, true)]
  ]);

  // Hipervisor. Solo existe si la instancia esta vinculada a su VM en DPA.
  const hv = filas([
    ["Espera por CPU física", val(i.vm_ready, "%", 5, 10)],
    ["Memoria reclamada",     val(i.vm_balloon, "%", 1, 5)],
    ["CPU de la VM",          val(i.vm_cpu, "%", 85, 95)],
    ["CPU del host",          val(i.host_cpu, "%", 75, 90)],
    ["Memoria del host",      val(i.host_memoria, "%", 80, 92)]
  ]);

  const alarmas = CAT_DETALLE
    .filter(c => (i.alarmas || {})[c])
    .map(c => '<span class="tag ' + colorNivelCat(i.alarmas[c]) + '">' +
              esc(CAT_ES[c] || c) + "</span>")
    .join("");


  return '<div class="detalle">' +
           '<div class="subt">Rendimiento</div><table>' + rec + "</table>" +
           (mem ? '<div class="subt">Memoria</div><table>' + mem + "</table>" : "") +
           (hv ? '<div class="subt">Hipervisor</div><table>' + hv + "</table>" : "") +

// En presentacion las tablas de detalle se ocultan para dejar sitio a los
// listados, pero el PLE y el hipervisor son justo lo que hay que vigilar en
// una tele. Este bloque compacto vive en la columna izquierda, que tiene
// hueco de sobra.
function clavesHTML(i){
  const celda = (et, v, cls) => v == null ? "" :
    '<div class="kv"><span class="k">' + esc(et) + "</span>" +
    '<span class="v ' + (cls || "") + '">' + v + "</span></div>";

  const niv = (v, aviso, critico, invertido) => {
    if (v == null) return "";
    const malo = invertido ? v <= critico : v >= critico;
    const reg  = invertido ? v <= aviso   : v >= aviso;
    return malo ? "v-alarm" : (reg ? "v-warn" : "");
  };

  const mem =
    celda("Page life expectancy", i.ple != null ? fmt(i.ple, 0) + " s" : null,
          niv(i.ple, 300, 120, true)) +
    celda("Recompilaciones", i.recompilaciones_seg != null
          ? fmt(i.recompilaciones_seg, 1) + "/s" : null,
          niv(i.recompilaciones_seg, 20, 50)) +
    celda("Buffer cache", fmtMB(i.cache_mb)) +
    celda("Caché de planes", fmtMB(i.plan_cache_mb));

  const hv =
    celda("Espera por CPU física", i.vm_ready != null
          ? fmt(i.vm_ready, 2) + " %" : null, niv(i.vm_ready, 5, 10)) +
    celda("Memoria reclamada", i.vm_balloon != null
          ? fmt(i.vm_balloon, 1) + " %" : null, niv(i.vm_balloon, 1, 5)) +
    celda("CPU del host", i.host_cpu != null
          ? fmt(i.host_cpu, 0) + " %" : null, niv(i.host_cpu, 75, 90)) +
    celda("Memoria del host", i.host_memoria != null
          ? fmt(i.host_memoria, 0) + " %" : null, niv(i.host_memoria, 80, 92));

  if (!mem && !hv) return "";
  return '<div class="claves">' +
    (mem ? '<div class="subt">Memoria en detalle</div>' +
           '<div class="kvgrid">' + mem + "</div>" : "") +
    (hv ? '<div class="subt">Hipervisor</div>' +
          '<div class="kvgrid">' + hv + "</div>" : "") +
    "</div>";
}

// MB a una unidad legible: 23456 -> "22,9 GB"
function fmtMB(v){
  if (v == null) return null;
  return v >= 1024 ? fmt(v / 1024, 1) + " GB" : fmt(v, 0) + " MB";
}

// Ranking de lo que mas bloquea en el dia. Lo acumula el colector a partir
// de las listas de bloqueo de cada ciclo: DPA da el numero, no el porque.
function topBloqueosHTML(i){
  const t = i.bloqueos_top;
  if (!Array.isArray(t) || !t.length) return "";
  const max = Math.max.apply(null, t.map(x => x.veces || 0)) || 1;
  const items = t.map(x => {
    const pct = Math.max(4, Math.round(100 * (x.veces || 0) / max));
    const hora = x.ultima
      ? new Date(x.ultima * 1000).toLocaleTimeString("es-ES",
          {hour:"2-digit", minute:"2-digit"}) : "";
    const peor = x.espera_max ? fmtDur(x.espera_max) : "";
    return '<li title="' + esc(x.etiqueta + (x.bd ? " · " + x.bd : "") +
             (peor ? "\nespera más larga: " + peor : "")) + '">' +
           '<span class="tb-barra"><i style="width:' + pct + '%"></i></span>' +
           '<span class="tb-txt">' + esc(x.etiqueta) +
             (x.bd ? ' <span class="tb-bd">' + esc(x.bd) + "</span>" : "") +
           "</span>" +
           '<span class="tb-n">' + fmt(x.veces, 0) + "×</span>" +
           '<span class="tb-h">' + (peor ? esc(peor) : esc(hora)) + "</span></li>";
  }).join("");
  return '<div class="topbloq"><h3>Lo que más bloquea hoy</h3>' +
         "<ul>" + items + "</ul>" +
         '<div class="nota">Desde las 00:00 · «×» son incidentes distintos, ' +
         'a la derecha la espera más larga</div>' +
         "</div>";
}

// Barras de porcentaje. `invertido` para las que "menos es peor".
function barra(etiqueta, v, aviso, critico, invertido){
  if (v === null || v === undefined) return "";
  const pct = Math.max(0, Math.min(100, v));
  let cls = "ok";
  if (invertido){
    if (v <= critico) cls = "alarm"; else if (v <= aviso) cls = "warn";
  } else {
    if (v >= critico) cls = "alarm"; else if (v >= aviso) cls = "warn";
  }
  return '<div class="g">' +
           '<span class="gl">' + esc(etiqueta) + "</span>" +
           '<span class="gbar"><i class="' + cls + '" style="width:' + pct + '%"></i></span>' +
           '<span class="gv v-' + cls + '">' + fmt(v, 0) + "%</span>" +
         "</div>";
}

}

function agHTML(i){
  const g = i.ag_detalle;

        ? '<span class="v-warn">' + esc(g.conmutacion) + "</span>"

function celdaBloqueo(s, col){
  const v = s[col.k];

    if (v === "espera")  return '<span class="rol w">espera</span>';
    return "";
  }
  if (col.k === "espera_s")       return v == null ? "—" : fmtDur(v);
  if (col.k === "trans_abiertas") return v == null ? "—" : fmt(v, 0);
  if (col.k === "programa" && v){
    const p = programaCorto(v, s.job_nombre);
    return p.job ? '<span class="jobn">' + esc(p.txt) + "</span>" : esc(p.txt);
  }
  if (v === null || v === undefined || v === "") return "—";
  return esc(v);
}

function tablaBloqueos(lista, soloTV){
  const cols = COLS_BLOQUEO.filter(c => !soloTV || c.tv);
  const cab = cols.map(c =>

  const cuerpo = lista.map(s =>
    "<tr>" + cols.map(c => {

function hayQueMostrarBloqueos(i){

}

// El numero grande viene de la metrica de DPA (muestreo por minuto) y la lista
// es una foto en vivo. Si el atasco ya se ha deshecho, lo decimos en vez de
// dejar un numero sin explicacion.
// Columnas de la tabla de sesiones activas. Sin "rol", que ahi no aplica.
const COLS_SESION = [
  {k:"spid",           t:"SPID",      cls:"c-spid"},
  {k:"login",          t:"Login",     cls:"c-el"},
  {k:"programa",       t:"Programa",  cls:"c-el c-ancha"},
  {k:"host",           t:"Host",      cls:"c-el"},
  {k:"bd",             t:"BD",        cls:"c-el"},
  {k:"comando",        t:"Comando",   cls:""},
  {k:"espera",         t:"Espera",    cls:"c-esp"},
  {k:"espera_s",       t:"Tiempo",    cls:"c-num"},
  {k:"trans_abiertas", t:"Trans.",    cls:"c-num"},
  {k:"bloqueado_por",  t:"Bloq. por", cls:"c-num"},
  {k:"estado",         t:"Estado",    cls:""}
];

// SQL Server pone en program_name el job_id en binario, no el nombre:
//   SQLAgent - TSQL JobStep (Job 0x4C6D7259FBCE654E... : Step 1)
// Los tres primeros grupos del GUID van en little-endian, asi que hay que
// darles la vuelta byte a byte para recomponerlo.
function jobGuid(hex){
  const h = String(hex || "").replace(/^0x/i, "").toUpperCase();
  if (h.length < 32) return null;
  const b = k => h.substr(k * 2, 2);
  return b(3)+b(2)+b(1)+b(0) + "-" + b(5)+b(4) + "-" + b(7)+b(6) + "-" +
         b(8)+b(9) + "-" + b(10)+b(11)+b(12)+b(13)+b(14)+b(15);
}

// Deja legible el programa. Si el colector ha podido resolver el nombre del
// job contra msdb lo usamos; si no (pymssql ausente, SQL directo apagado o
// conexion caida), caemos a los 8 primeros digitos del GUID, que al menos
// distinguen un job de otro.
function programaCorto(p, jobNombre){
  const t = String(p || "");
  const m = t.match(/SQLAgent\s*-\s*TSQL\s*JobStep\s*\(\s*Job\s+(0x[0-9A-Fa-f]+)[^)]*?(?::\s*Step\s*(\d+))?\s*\)/i);
  if (!m) return {txt: t, tit: t, job: false};
  const g = jobGuid(m[1]);
  const paso = m[2] ? " · paso " + m[2] : "";
  if (jobNombre){
    return {
      txt: jobNombre + paso,
      tit: "Job de SQL Agent: " + jobNombre + paso + (g ? "\njob_id: " + g : ""),
      job: true
    };
  }
  const corto = g ? g.split("-")[0] : m[1].slice(2, 10).toUpperCase();
  return {
    txt: "SQL Agent · job " + corto + paso,
    tit: "SQL Agent JobStep" + paso + (g ? "\njob_id: " + g : "") +
         "\n\nNombre sin resolver. Para verlo:\n" +
         "SELECT name FROM msdb.dbo.sysjobs WHERE job_id = '" + (g || "") + "'",
    job: false
  };
}

// Las consultas paralelas aparecen una vez por hilo: el mismo SPID repetido
// 10 veces con la misma espera. Se agrupan en una fila y se anota cuantos
// hilos hay, que ademas deja el paralelismo a la vista.
function agruparSesiones(lista){
  const porSpid = new Map();
  lista.forEach(f => {
    const k = (f.spid == null || f.spid === "") ? Math.random() : String(f.spid);
    const g = porSpid.get(k);
    if (!g){ porSpid.set(k, {fila: f, hilos: 1, maxEspera: f.espera_s || 0}); return; }
    g.hilos++;
    // nos quedamos con la fila de mayor espera: es la representativa
    if ((f.espera_s || 0) > (g.maxEspera || 0)){ g.fila = f; g.maxEspera = f.espera_s || 0; }
  });
  return [...porSpid.values()]
    .map(g => Object.assign({}, g.fila, {__hilos: g.hilos}))
    .sort((a, b) => (b.espera_s || 0) - (a.espera_s || 0));
}

// Tabla de sesiones activas: va a lo ancho de la tarjeta, con scroll propio y
// cabecera fija, para que la tarjeta no crezca aunque haya 113 sesiones.
function sesionesHTML(i){
  const bruto = i.sesiones_detalle || [];
  const s = agruparSesiones(bruto);
  const total = i.sesiones_activas;

  if (i.sesiones_detalle_error){
    return '<div class="act"><h3>Sesiones activas</h3>' +
           '<div class="nota">No he podido leer el detalle: ' +
           esc(i.sesiones_detalle_error) + "</div></div>";
  }
  // Vacio con titulo: en presentacion un hueco sin nada parece un fallo.
  // La clase 'vacio' hace que solo se vea en ese modo.
  if (!s.length){
    return '<div class="act vacio"><h3>Sesiones activas</h3>' +
           '<div class="nota">Ninguna sesión activa en este momento</div></div>';
  }

  const cab = COLS_SESION.map(c =>
    '<th class="' + c.cls + " c-k-" + c.k + '">' + esc(c.t) + "</th>").join("");
  const cuerpo = s.map(f =>
    "<tr>" + COLS_SESION.map(c => {
      if (c.k === "programa"){
        const p = programaCorto(f.programa, f.job_nombre);
        return '<td class="' + c.cls + ' c-k-programa" title="' + esc(p.tit) + '">' +
               (p.job ? '<span class="jobn">' + esc(p.txt) + "</span>" : esc(p.txt)) +
               (f.__hilos > 1 ? ' <span class="hilos">× ' + f.__hilos + " hilos</span>" : "") +
               "</td>";
      }
      return '<td class="' + c.cls + " c-k-" + c.k + '" title="' +
             esc(String(f[c.k] == null ? "" : f[c.k])) + '">' +
             celdaBloqueo(f, c) + "</td>";
    }).join("") + "</tr>"
  ).join("");

  // `total` cuenta sesiones; `bruto` son filas por hilo. Decirlo, porque si no
  // "30 de 30" con 12 filas en pantalla parece un error.
  const paralelas = bruto.length - s.length;
  const pie = (total != null && total > s.length)
    ? '<div class="nota nota-normal">Mostrando ' + s.length + " de " +
      fmt(total, 0) + " sesiones, ordenadas por tiempo de espera" +
      (paralelas > 0 ? " · " + paralelas + " hilos paralelos agrupados" : "") +
      "</div>"
    : (paralelas > 0
        ? '<div class="nota nota-normal">' + paralelas +
          " hilos paralelos agrupados en su sesión</div>"
        : "");

  // En presentacion no hay scroll: se ven como mucho PRES_FILAS filas de las
  // que hemos traido, y el aviso cuenta contra el total real de la instancia
  const visibles = Math.min(s.length, PRES_FILAS);
  const ocultas = Math.max(0, (total != null ? total : s.length) - visibles);
  const pieP = ocultas
    ? '<div class="nota solo-pres">… y ' + fmt(ocultas, 0) +
      " más, ordenadas por tiempo de espera</div>"
    : "";

  return '<div class="act">' +
           "<h3>Sesiones activas" +
             (total != null ? " <span class=\"pista\">(" + fmt(total, 0) + ")</span>" : "") +
           "</h3>" +
           '<div class="scroll"><table class="btab">' +
             "<thead><tr>" + cab + "</tr></thead><tbody>" + cuerpo + "</tbody>" +
           "</table></div>" + pie + pieP +
         "</div>";
}

function resumenPills(insts){
  if (!insts.length) return '<span class="pill">Sin instancias</span>';
  const c = {critico:0, aviso:0, caido:0};
  insts.forEach(i => { if (c[i.nivel] !== undefined) c[i.nivel]++; });
  const out = [];
  if (c.critico) out.push('<span class="pill alarm">⚠ ' + c.critico + " crítico</span>");
  if (c.aviso)   out.push('<span class="pill warn">⚠ ' + c.aviso + " degradado</span>");
  if (c.caido)   out.push('<span class="pill">✖ ' + c.caido + " caído</span>");
  if (!out.length) out.push('<span class="pill ok">✔ Todo correcto</span>');
  return out.join("");
}

function render(estado){
  const insts = estado.instancias || [];
  const cont = document.getElementById("sites");

  // El servicio responde pero no puede hablar con DPA: avisar sin ocultar datos
  if (estado.error){
    const b = document.getElementById("banner");
    b.style.display = "block";
    b.textContent = "El colector no puede hablar con DPA: " + estado.error +
                    ". Los datos que ves pueden estar obsoletos.";
  }

  const hora = estado.actualizado
    ? new Date(estado.actualizado * 1000).toLocaleTimeString("es-ES") : "—";

  cont.innerHTML =
    '<section class="site" style="--sc:' + SECCION.color + '">' +
      '<div class="site-h">' +
        '<span class="swatch"></span>' +
        '<span class="site-name">' + SECCION.nombre + "</span>" +
        resumenPills(insts) +
        '<span class="upd">Actualizado ' + esc(hora) + "</span>" +
      "</div>" +
      '<div class="cards">' + insts.map(tarjeta).join("") + "</div>" +
    "</section>";

  pintarBloqueosTV(insts);
  // primero se decide que tarjeta se ve y luego se pintan las graficas: al
  // reves saldrian dibujadas con ancho cero
  if (soloOn){
    // la lista de instancias puede reordenarse entre refrescos: hay que
    // volver a localizar la diapositiva de ATENEA2, no fiarse del indice
    const p = soloPaso();
    if (p >= 0) presIdx = p;
    presAplicar();
    pintarFranja();
  } else if (presOn) presAplicar();
  pintarTodas();
  if (document.body.classList.contains("tv")) fitTV();
  avisarSiEmpeora(insts);
}

// -------------------------------------------------------------------- alertas

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = .15;
    o.connect(g); g.connect(ctx.destination);
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 400);
  }catch(e){}
}

function avisarSiEmpeora(insts){
  insts.forEach(i => {
    const malo = (i.nivel === "critico" || i.nivel === "caido");
    if (malo && !prevBad[i.nombre] && alertsOn){
      beep();
      try{
        if (window.Notification && Notification.permission === "granted"){
          new Notification("DPA: " + i.nombre, {body: (i.avisos || []).join(" · ")});
        }
      }catch(e){}
    }
    prevBad[i.nombre] = malo;
  });
}

// -------------------------------------------------------------------- charts

function drawChart(cv, pts){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = cv.clientHeight || 52;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);

  const corte = Date.now()/1000 - rangeH*3600;
  const d = (pts || []).filter(p => p.t >= corte);

  if (d.length < 2){
    ctx.fillStyle = "#64748b"; ctx.font = "11px Segoe UI";
    ctx.fillText("Recopilando histórico…", 4, H/2 + 4);
    return;
  }

  const PR = 38, PT = 4, PB = 4;
  const t0 = d[0].t, t1 = d[d.length-1].t;
  let lo = Math.min.apply(null, d.map(p => p.v));
  let hi = Math.max.apply(null, d.map(p => p.v));
  if (hi - lo < 1){ const m = (hi+lo)/2; lo = m - .5; hi = m + .5; }
  const pad = (hi - lo) * .15; lo -= pad; hi += pad;

  const X = t => PT + (t - t0) / Math.max(1, t1 - t0) * (W - PR - PT);
  const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);

  const col = cv.dataset.color || "#38bdf8";
  ctx.beginPath();
  d.forEach((p,k) => { const x = X(p.t), y = Y(p.v); k ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.lineTo(X(t1), H - PB); ctx.lineTo(X(t0), H - PB); ctx.closePath();
  ctx.fillStyle = col + "22"; ctx.fill();

  ctx.beginPath();
  d.forEach((p,k) => { const x = X(p.t), y = Y(p.v); k ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.stroke();

  const maxV = Math.max.apply(null, d.map(p => p.v));
  const minV = Math.min.apply(null, d.map(p => p.v));
  ctx.font = "10px Segoe UI"; ctx.fillStyle = "#94a3b8";
  ctx.fillText(fmt(maxV,1), W - PR + 3, 10);
  ctx.fillText(fmt(minV,1), W - PR + 3, H - 3);
  ctx.fillStyle = "#e2e8f0";
  ctx.fillText(fmt(d[d.length-1].v,1), W - PR + 3, Math.min(H-12, Math.max(18, Y(d[d.length-1].v) + 3)));
}

function pintarTodas(){
  document.querySelectorAll("canvas.chart").forEach(cv => {
    drawChart(cv, histSeries[cv.dataset.key] || []);
  });
}

function tickHist(estado){
  const insts = (estado && estado.instancias) || [];
  if (!insts.length) return;
  const nuevo = {};
  const peticiones = [];
  insts.forEach(i => {
    ["Active Sessions", "Instance Wait Time", "CPU Utilization"].forEach(met => {
      const clave = i.db_id + "|" + met;
      nuevo[clave] = histSeries[clave] || [];
      const url = "/api/historico?db=" + encodeURIComponent(i.db_id) +
                  "&metrica=" + encodeURIComponent(met) + "&horas=24";
      peticiones.push(
        fetch(url).then(r => r.json()).then(j => {
          nuevo[clave] = j.puntos || [];
        }).catch(() => {})
      );
    });
  });
  // reconstruimos el objeto para no acumular instancias que ya no existen
  Promise.all(peticiones).then(() => { histSeries = nuevo; pintarTodas(); });
}

// --------------------------------------------------- modo presentacion

const PRES_SEG = 15;    // segundos por diapositiva
const PRES_FILAS = 12;  // filas visibles por tabla, sin scroll

// Orden de rotacion. Se comparan con el nombre corto (el de Modo TV). Las
// instancias que no aparezcan aqui se anaden al final por orden alfabetico.
const PRES_ORDEN = ["ATENEA2", "SRVPBI", "PROMETEO", "AQUILES", "SCALEPROD"];

let presOn = false;
let presIdx = 0;        // indice dentro de la secuencia de diapositivas
let presResta = PRES_SEG;
let presPausa = false;

function presInstancias(){
  return (window.__ultimoEstado && window.__ultimoEstado.instancias) || [];
}

// Secuencia: una pantalla general cada dos instancias.
//   General · ATENEA2 · SRVPBI · General · PROMETEO · AQUILES · General · SCALEPROD
function presSecuencia(){
  const insts = presInstancias();
  if (!insts.length) return [];

  const orden = [];
  PRES_ORDEN.forEach(corto => {
    const k = insts.findIndex(i => tituloTV(i.nombre) === corto);
    if (k >= 0 && orden.indexOf(k) < 0) orden.push(k);
  });
  insts.forEach((_, k) => { if (orden.indexOf(k) < 0) orden.push(k); });

  const pasos = [];
  orden.forEach((k, n) => {
    if (n % 2 === 0) pasos.push({t: "g"});
    pasos.push({t: "i", k: k});
  });
  return pasos;
}

// Las instancias con problemas se quedan el doble de tiempo. La general,
// siempre lo mismo.
function presDuracion(paso){
  if (!paso || paso.t === "g") return PRES_SEG;
  const inst = presInstancias()[paso.k];
  const mal = inst && (inst.nivel === "critico" || inst.nivel === "caido");
  return mal ? PRES_SEG * 2 : PRES_SEG;
}

function presIr(idx){
  const pasos = presSecuencia();
  if (!pasos.length){ presAplicar(); return; }
  presIdx = ((idx % pasos.length) + pasos.length) % pasos.length;
  presResta = presDuracion(pasos[presIdx]);
  presAplicar();
  // las graficas se dibujaron con la tarjeta oculta (ancho 0): hay que
  // repintarlas ahora que tiene tamano real
  pintarTodas();
}

// En presentacion los listados suben a las columnas: las sesiones activas
// ocupan la del centro y los bloqueos la de la derecha, encima de las
// graficas. Se mueven los nodos en vez de duplicarlos.
function presReubicarListas(tarjeta){
  if (!tarjeta) return;
  const zb = tarjeta.querySelector(".zona-b");
  const zc = tarjeta.querySelector(".zona-c");
  const act = tarjeta.querySelector(":scope > .act");
  const blk = tarjeta.querySelector(":scope > .blk");
  if (act && zb) zb.insertBefore(act, zb.firstChild);
  if (blk && zc) zc.insertBefore(blk, zc.firstChild);

  // Las graficas se quedan en la columna derecha, apiladas y pequenas: a lo
  // ancho del pie desperdiciaban media pantalla y dejaban la derecha vacia.
  // El ranking de bloqueos va entre la lista y las graficas.
  const graf = tarjeta.querySelector(".charts");
  const top  = tarjeta.querySelector(":scope > .topbloq");
  if (zc){
    if (top)  zc.appendChild(top);
    if (graf) zc.appendChild(graf);
  }
}

function presAplicar(){
  if (!presOn) return;
  const insts = presInstancias();
  const pasos = presSecuencia();
  const tarjetas = [...document.querySelectorAll("#sites .card")];
  if (!pasos.length || !tarjetas.length) return;

  if (presIdx >= pasos.length){ presIdx = 0; presResta = presDuracion(pasos[0]); }
  const paso = pasos[presIdx];
  const general = paso.t === "g";

  // En la general se anade la clase tv y manda todo el CSS del Modo TV
  document.body.classList.toggle("g", general);
  document.body.classList.toggle("tv", general);

  if (general){
    tarjetas.forEach(c => c.classList.remove("pres-on"));
    fitTV();
  } else {
    tarjetas.forEach((c, k) => c.classList.toggle("pres-on", k === paso.k));
    document.getElementById("sites").style.height = "";
    presReubicarListas(tarjetas[paso.k]);
  }

  const total = presDuracion(paso);
  const pct = Math.max(0, Math.min(100, (presResta / total) * 100));
  const rota = pasos.length > 1;

  const puntos = pasos.map((p, k) => {
    if (p.t === "g"){
      return '<span class="p gen' + (k === presIdx ? " on" : "") +
             '" data-idx="' + k + '"><i></i>General</span>';
    }
    const i = insts[p.k];
    if (!i) return "";
    const mal = (i.nivel === "critico" || i.nivel === "caido") ? " mal" : "";
    return '<span class="p' + (k === presIdx ? " on" : "") + mal +
           '" data-idx="' + k + '" style="--cc:' + colorServidor(i.nombre) + '">' +
           "<i></i>" + esc(tituloTV(i.nombre)) + "</span>";
  }).join("");

  // Solo rehacemos el HTML cuando cambia algo estructural. Si lo reescribimos
  // cada segundo se pierden clics del usuario y la barra no puede animarse.
  const nav = document.getElementById("pres-nav");
  const firma = insts.map(i => i.nombre + "|" + i.nivel).join(",") + "#" + presIdx;
  if (nav.dataset.firma !== firma){
    nav.dataset.firma = firma;
    nav.innerHTML = '<div class="puntos">' + puntos + "</div>" +
      '<span class="cuenta"></span><span class="barra"><i></i></span>';
  }
  nav.querySelector(".cuenta").textContent =
    !rota ? "" : (presPausa ? "en pausa" : presResta + " s");
  nav.querySelector(".barra").style.display = rota ? "" : "none";
  nav.querySelector(".barra i").style.width = pct + "%";
}

function presTick(){
  if (!presOn || presPausa) return;
  if (soloOn) return;              // el modo Solo no rota: se queda clavado
  if (presSecuencia().length < 2){ presAplicar(); return; }
  presResta--;
  if (presResta <= 0) presIr(presIdx + 1);
  else presAplicar();
}

// ------------------------------------------------- modo Solo ATENEA2
//
// Es el modo presentacion congelado en una instancia. Reutiliza su
// maquetacion entera, asi que aqui solo hay que fijar la diapositiva y
// gestionar la franja de avisos de las demas.

const SOLO_CORTO     = "ATENEA2";
const FRANJA_VIS_S   = 20;    // segundos que la franja permanece asomada
const FRANJA_CICLO_S = 150;   // cada cuanto vuelve a asomar si el problema sigue

let soloOn    = false;
let franjaSeg = 0;

// Indice, dentro de la secuencia de diapositivas, de la tarjeta de ATENEA2.
function soloPaso(){
  const insts = presInstancias();
  const k = insts.findIndex(i => tituloTV(i.nombre) === SOLO_CORTO);
  if (k < 0) return -1;
  return presSecuencia().findIndex(p => p.t === "i" && p.k === k);
}

// Las demas instancias que merecen interrumpir: sesiones bloqueadas, o el
// monitor caido / sin datos. Deliberadamente NO entran los avisos de CPU,
// memoria o backups: generarian ruido constante en una pantalla de sala.
//
// Para "caido" nos fiamos del nivel que ya calcula el colector: alli se
// contemplan RUNNING y STARTED como buenos, ademas del error de conexion.
// Repetir la comprobacion aqui daria falsos positivos.
function franjaProblemas(){
  return presInstancias().filter(i => {
    if (tituloTV(i.nombre) === SOLO_CORTO) return false;
    const bloq = (i.sesiones_bloqueadas || 0) > 0 || (i.bloqueos || []).length > 0;
    return bloq || i.nivel === "caido";
  }).map(i => {
    const caido = i.nivel === "caido";
    const n = (i.sesiones_bloqueadas || 0) || (i.bloqueos || []).length;
    return {
      nombre: tituloTV(i.nombre),
      detalle: caido ? "sin datos"
                     : (n + (n === 1 ? " sesión bloqueada" : " sesiones bloqueadas")),
      caido: caido
    };
  });
}

function pintarFranja(){
  const fr = document.getElementById("franja");
  if (!soloOn){
    document.body.classList.remove("fr-on", "fr-hay");
    return;
  }
  const probs = franjaProblemas();
  document.body.classList.toggle("fr-hay", probs.length > 0);

  if (!probs.length){
    // al normalizarse se retira de inmediato y se reinicia el ciclo
    document.body.classList.remove("fr-on");
    franjaSeg = 0;
    return;
  }

  const hayCaido = probs.some(p => p.caido);
  fr.querySelector(".fr-in").innerHTML =
    '<span class="fr-ico">' + (hayCaido ? "&#9888;" : "&#128721;") + "</span>" +
    '<span class="fr-tit">Otras instancias</span>' +
    probs.map(p =>
      '<span class="fr-it"><b>' + esc(p.nombre) + "</b>" +
      '<span class="fr-d">' + esc(p.detalle) + "</span></span>").join("");
}

function franjaTick(){
  if (!soloOn || !document.body.classList.contains("fr-hay")) return;
  franjaSeg++;
  const t = franjaSeg % FRANJA_CICLO_S;
  document.body.classList.toggle("fr-on", t < FRANJA_VIS_S);
}

function toggleSolo(mantenerFs){
  const estaba = soloOn;

  // Modo TV y Presentacion no pueden convivir con este
  if (!estaba){
    if (presOn && !document.body.classList.contains("solo")) togglePres(true);
    if (document.body.classList.contains("tv") &&
        !document.body.classList.contains("g")) toggleTV(true);
  }

  soloOn = !estaba;
  document.body.classList.toggle("solo", soloOn);
  document.getElementById("btn-solo").classList.toggle("on", soloOn);

  if (soloOn){
    presOn = true;
    presPausa = false;
    document.body.classList.add("pres");
    if (!mantenerFs && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(() => {});
    }
    const p = soloPaso();
    if (p >= 0) presIr(p); else presAplicar();
    franjaSeg = 0;
    pintarFranja();
  } else {
    document.body.classList.remove("fr-on", "fr-hay");
    presOn = false;
    document.body.classList.remove("pres", "g", "tv");
    document.getElementById("btn-tv").classList.remove("on");
    document.getElementById("btn-pres").classList.remove("on");
    document.getElementById("sites").style.height = "";
    const nav = document.getElementById("pres-nav");
    nav.innerHTML = ""; nav.dataset.firma = "";
    document.querySelectorAll(".card.pres-on")
      .forEach(c => c.classList.remove("pres-on"));
    if (!mantenerFs && document.exitFullscreen && document.fullscreenElement){
      document.exitFullscreen();
    }
    pintarTodas();
  }
}

// `mantenerFs` = no tocar la pantalla completa. Se usa al saltar de un modo a
// otro: si salimos y volvemos a entrar en fullscreen en el mismo gesto, se ve
// un parpadeo y el navegador puede rechazar la segunda peticion.
function togglePres(mantenerFs){
  const estaba = document.body.classList.contains("pres");
  // si veniamos de Modo TV "de verdad" (no de la diapositiva general)
  if (!estaba && document.body.classList.contains("tv")) toggleTV(true);
  presOn = !estaba;
  document.body.classList.toggle("pres", presOn);
  document.getElementById("btn-pres").classList.toggle("on", presOn);

  if (presOn){
    presPausa = false;
    if (!mantenerFs && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(() => {});
    }
    presIr(presIdx);
    presAplicar();
  } else {
    if (!mantenerFs && document.exitFullscreen && document.fullscreenElement){
      document.exitFullscreen();
    }
    // la diapositiva general deja puestas las clases g y tv: hay que quitarlas
    document.body.classList.remove("g", "tv");
    document.getElementById("btn-tv").classList.remove("on");
    document.getElementById("sites").style.height = "";
    const nav = document.getElementById("pres-nav");
    nav.innerHTML = "";
    nav.dataset.firma = "";
    document.querySelectorAll(".card.pres-on")
      .forEach(c => c.classList.remove("pres-on"));
  }
  pintarTodas();
}

// ---------------------------------------------------------------- modo TV

function fitTV(){
  const cont = document.getElementById("sites");
  const header = document.querySelector("header");
  const panel = document.getElementById("bloqueos-tv");

  const pie = document.querySelector("footer");
  const nav = document.getElementById("pres-nav");
  const navAlto = (nav && nav.offsetHeight) || 0;   // solo en presentacion
  const disponible = window.innerHeight - header.offsetHeight -
                     (pie ? pie.offsetHeight : 0) - navAlto - 16;
  const hayPanel = panel && panel.style.display !== "none" && panel.innerHTML;

  if (hayPanel){
    // Las tarjetas se quedan con lo justo y el panel se lleva TODO el resto:
    // es donde hay texto que leer, asi que es donde interesa el espacio.
    cont.style.height = "";
    panel.style.height = "";
    const usado = cont.offsetHeight;
    panel.style.height = Math.max(140, disponible - usado - 10) + "px";
  } else {
    // Sin bloqueos, las tarjetas ocupan la pantalla entera.
    panel.style.height = "";
    cont.style.height = disponible + "px";
  }

  [...cont.querySelectorAll("section.site")].forEach(s => {
    s.style.gridColumn = "1 / -1";
  });
}

function toggleTV(mantenerFs){
  document.body.classList.toggle("tv");
  const on = document.body.classList.contains("tv");
  document.getElementById("btn-tv").classList.toggle("on", on);
  if (on){
    if (!mantenerFs && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    fitTV();
  } else {
    if (!mantenerFs && document.exitFullscreen && document.fullscreenElement){
      document.exitFullscreen();
    }
    document.getElementById("sites").style.height = "";
  }
  pintarTodas();
}

// ------------------------------------------------------------------- ciclo

function pintarDesconexion(){
  const b = document.getElementById("banner");
  b.style.display = "block";
  b.textContent = "No se puede contactar con el servicio del dashboard. " +
                  "Los datos que ves pueden estar obsoletos.";
  document.body.classList.add("sincon");
}

function limpiarDesconexion(){
  document.getElementById("banner").style.display = "none";
  document.body.classList.remove("sincon");
  disconnectedSince = null;
}

function tick(){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 8000);
  fetch("/api/estado", {signal: ctrl.signal})
    .then(r => r.json())
    .then(j => {
      clearTimeout(to);
      limpiarDesconexion();
      // el estado se guarda ANTES de pintar: presAplicar() lo consulta
      const primera = !window.__ultimoEstado;
      window.__ultimoEstado = j;
      render(j);
      if (primera) tickHist(j);
    })
    .catch(() => {
      clearTimeout(to);
      if (!disconnectedSince) disconnectedSince = Date.now();
      pintarDesconexion();
    });
}

const DIAS_ES = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES",
                 "VIERNES", "SÁBADO"];
const MESES_ES = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
                  "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE",
                  "DICIEMBRE"];

// LUNES, 31 DE AGOSTO DE 2026, 14:38:01
function fechaLarga(d){
  const p = n => String(n).padStart(2, "0");
  return DIAS_ES[d.getDay()] + ", " + d.getDate() + " DE " +
         MESES_ES[d.getMonth()] + " DE " + d.getFullYear() + ", " +
         p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

// La maquina donde corre el dashboard, no la instancia que se esta viendo
function servidorDashboard(){
  return (window.__ultimoEstado && window.__ultimoEstado.servidor) || "";
}

function reloj(){
  const ahora = new Date();
  const srv = servidorDashboard();
  document.getElementById("clock").innerHTML =
    '<div class="fecha">' + esc(fechaLarga(ahora)) + "</div>" +
    (srv ? '<div class="srv">' + esc(srv) + "</div>" : "");
  if (disconnectedSince){
    const s = Math.floor((Date.now() - disconnectedSince)/1000);
    const hh = String(Math.floor(s/3600)).padStart(2,"0");
    const mm = String(Math.floor(s%3600/60)).padStart(2,"0");
    const ss = String(s%60).padStart(2,"0");
    document.getElementById("cron").textContent = hh + ":" + mm + ":" + ss;
  }
}

// ------------------------------------------------------------------ arranque

document.querySelectorAll(".btns button[data-h]").forEach(b => {
  b.addEventListener("click", () => {
    rangeH = Number(b.dataset.h);
    document.querySelectorAll(".btns button[data-h]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    pintarTodas();
  });
});

const btnAl = document.getElementById("btn-alertas");
function pintarBotonAlertas(){
  btnAl.textContent = "\u{1F514} Alertas: " + (alertsOn ? "ON" : "OFF");
  btnAl.classList.toggle("on", alertsOn);
}
btnAl.addEventListener("click", () => {
  alertsOn = !alertsOn;
  try { localStorage.setItem("dpa_alertas", alertsOn ? "1" : "0"); } catch(e){}
  if (alertsOn && window.Notification && Notification.permission === "default"){
    Notification.requestPermission();
  }
  pintarBotonAlertas();
});
pintarBotonAlertas();

document.getElementById("btn-tv").addEventListener("click", () => {
  if (soloOn) toggleSolo(true);
  else if (presOn) togglePres(true);   // no pueden convivir
  toggleTV();
});
document.getElementById("btn-pres").addEventListener("click", () => {
  if (soloOn) toggleSolo(true);
  togglePres();
});
document.getElementById("btn-solo").addEventListener("click", () => toggleSolo());

// clic en un nombre de la tira: salta a esa instancia
document.getElementById("pres-nav").addEventListener("click", e => {
  const p = e.target.closest(".p");
  if (p) presIr(Number(p.dataset.idx));
});

// atajos: flechas para moverse, espacio para pausar, Esc para salir
document.addEventListener("keydown", e => {
  if (soloOn){
    if (e.key === "Escape") toggleSolo();
    return;                       // en Solo no hay navegacion: no rota
  }
  if (!presOn) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); presIr(presIdx + 1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); presIr(presIdx - 1); }
  else if (e.key === " "){ e.preventDefault(); presPausa = !presPausa; presAplicar(); }
  else if (e.key === "Escape"){ togglePres(); }
});

// El navegador se come el Escape para salir de pantalla completa y no llega a
// la pagina: si no escuchamos esto, harian falta dos pulsaciones para salir.
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) return;
  if (soloOn) toggleSolo(true);
  else if (presOn) togglePres(true);
});

setInterval(presTick, 1000);
setInterval(franjaTick, 1000);
document.getElementById("logo").addEventListener("error", function(){ this.style.display = "none"; });
window.addEventListener("resize", () => {
  if (document.body.classList.contains("tv")) fitTV();
  pintarTodas();
});

tick();
setInterval(tick, REFRESH_S * 1000);
setInterval(() => tickHist(window.__ultimoEstado), HIST_REFRESH_S * 1000);
setInterval(reloj, 1000);
reloj();
</script>
